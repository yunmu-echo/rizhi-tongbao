<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>融智产品通报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#10b981;--blue:#3b82f6;--orange:#f59e0b;--red:#ef4444;--gray:#9ca3af;--bg:#f3f4f6;--card:#fff;--text:#1f2937;--border:#e5e7eb;--light-green:#d1fae5;--light-red:#fee2e2}
body{font-family:'PingFang SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:70px}
.header{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .date{font-size:12px;opacity:.9;margin-top:4px;font-weight:500}
.header .back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:none}
.header.has-back .back-btn{display:flex;align-items:center;justify-content:center}
.header.has-back h1{padding-left:28px}
.role-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.role-bar select{flex:1;min-width:80px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;color:var(--text)}
.role-btn{padding:8px 16px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.role-btn.active{background:var(--blue);color:#fff}
.quarter-toggle{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.quarter-toggle button{padding:6px 14px;border:none;border-radius:6px;font-size:12px;cursor:pointer;background:transparent;color:var(--gray);font-weight:500}
.quarter-toggle button.active{background:var(--blue);color:#fff}
.home-grid{padding:16px;display:flex;flex-direction:column;gap:12px}
.product-card{background:#fff;border-radius:12px;padding:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .15s}
.product-card:active{transform:scale(.98)}
.product-card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.product-card .card-title{font-size:16px;font-weight:600}
.product-card .card-badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:500}
.card-metrics{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.card-metric{text-align:center}
.card-metric .metric-value{font-size:20px;font-weight:700}
.card-metric .metric-label{font-size:11px;color:var(--gray);margin-top:2px}
.kpi-section{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:16px}
.kpi-box{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi-box .kpi-value{font-size:28px;font-weight:800;line-height:1.1}
.kpi-box .kpi-label{font-size:11px;color:var(--gray);margin-top:4px}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.table-section{padding:0 12px 12px}
.table-title{font-size:15px;font-weight:600;padding:12px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.data-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.data-table th{background:#f9fafb;padding:10px 8px;font-size:12px;font-weight:600;color:var(--gray);text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0}
.data-table td{padding:10px 8px;font-size:13px;border-bottom:1px solid #f3f4f6}
.data-table tr:last-child td{border-bottom:none}
.data-table tr.clickable{cursor:pointer}
.data-table tr.clickable:active{background:#f9fafb}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700}
.rank-1{background:#fef3c7;color:#d97706}
.rank-2{background:#e5e7eb;color:#6b7280}
.rank-3{background:#fed7aa;color:#c2410c}
.rank-bottom{background:var(--light-red);color:var(--red)}
.text-green{color:var(--green);font-weight:600}
.text-blue{color:var(--blue);font-weight:600}
.text-orange{color:var(--orange);font-weight:600}
.text-red{color:var(--red);font-weight:600}
.text-gray{color:var(--gray);font-weight:500}
.badge-fail{display:inline-block;background:#f3f4f6;color:var(--gray);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.cm-list{background:#f9fafb;border-radius:8px;margin:4px 0;overflow:hidden}
.cm-item{display:flex;align-items:center;padding:10px;font-size:12px;border-bottom:1px solid var(--border)}
.cm-item:last-child{border-bottom:none}
.cm-name{font-weight:600;width:55px;flex-shrink:0}
.cm-info{flex:1;color:var(--gray);margin:0 8px}
.cm-icons{display:flex;gap:4px;flex-wrap:wrap}
.cm-icon{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:2px 6px;border-radius:4px}
.cm-icon.done{background:var(--light-green);color:var(--green)}
.cm-icon.need{background:#fef3c7;color:var(--orange)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:500px;width:100%;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,8px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;border:none;background:none;color:var(--gray);font-size:10px;transition:color .2s}
.nav-item.active{color:var(--blue)}
.nav-item .nav-icon{font-size:20px}
.nav-item .nav-label{font-weight:500;white-space:nowrap}
.terminology{margin:12px 16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.terminology-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.terminology-body{padding:0 16px;display:none}
.terminology-body.open{display:block;padding:0 16px 12px}
.term-item{padding:6px 0;font-size:12px;border-bottom:1px solid #f3f4f6}
.term-item:last-child{border-bottom:none}
.term-name{font-weight:600;color:var(--blue)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-content{background:#fff;width:100%;max-width:500px;max-height:70vh;border-radius:16px 16px 0 0;overflow-y:auto;padding:20px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--gray)}
.breadcrumb{display:flex;gap:4px;align-items:center;padding:8px 16px;font-size:12px;color:var(--gray);background:#fff;border-bottom:1px solid var(--border)}
.breadcrumb span{cursor:pointer;color:var(--blue)}
.breadcrumb span.current{color:var(--text);font-weight:600;cursor:default}
.breadcrumb .sep{color:var(--gray);cursor:default}
.loading{text-align:center;padding:40px;color:var(--gray)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header" id="header">
  <button class="back-btn" id="backBtn" onclick="goBack()">←</button>
  <h1 id="headerTitle">融智产品通报</h1>
  <div class="date" id="headerDate"></div>
</div>

<!-- HOME VIEW -->
<div id="homeView">
  <div class="role-bar">
    <button class="role-btn active" data-role="branch_all" onclick="switchRole('branch_all')">分行</button>
    <button class="role-btn" data-role="sub_branch" onclick="switchRole('sub_branch')">支行</button>
    <button class="role-btn" data-role="team" onclick="switchRole('team')">团队</button>
    <select id="branchSelect" class="hidden" onchange="onBranchChange()">
      <option value="">选择支行</option>
    </select>
    <select id="teamSelect" class="hidden" onchange="onTeamChange()">
      <option value="">选择团队</option>
    </select>
    <div class="quarter-toggle">
      <button class="active" data-q="q4" onclick="switchQuarter('q4')">Q4</button>
      <button data-q="q3" onclick="switchQuarter('q3')">Q3</button>
    </div>
  </div>
  <div class="home-grid" id="homeGrid"></div>
  <div class="terminology">
    <div class="terminology-header" onclick="toggleTerminology()">
      <span>📖 术语说明</span>
      <span class="expand-icon" id="termIcon" style="display:inline-block;transition:transform .2s;font-size:10px;color:var(--gray)">▶</span>
    </div>
    <div class="terminology-body" id="termBody">
      <div class="term-item"><span class="term-name">有价值客户数：</span>当前时点有价值客户存量数</div>
      <div class="term-item"><span class="term-name">Q4目标：</span>四季度净增目标值</div>
      <div class="term-item"><span class="term-name">净增完成率：</span>(当前数-期初数)/目标数×100%</div>
      <div class="term-item"><span class="term-name">破冰率：</span>已破冰客户数/应破冰客户数×100%</div>
      <div class="term-item"><span class="term-name">鲤想财资：</span>企业财资管理产品</div>
      <div class="term-item"><span class="term-name">锦鲤资产池：</span>资产池理财产品</div>
      <div class="term-item"><span class="term-name">鲤想薪管家：</span>代发薪产品</div>
      <div class="term-item"><span class="term-name">鲤想智园：</span>智慧园区产品</div>
      <div class="term-item"><span class="term-name">鲤想住管家：</span>住房租赁产品</div>
    </div>
  </div>
</div>

<!-- DETAIL VIEW (drill-down) -->
<div id="detailView" class="hidden">
  <div id="breadcrumbBar" class="breadcrumb hidden"></div>
  <div class="kpi-section" id="kpiSection"></div>
  <div class="table-section">
    <div class="table-title" id="tableTitle"></div>
    <div id="tableWrap"></div>
  </div>
</div>

<!-- ICE MODAL -->
<div class="modal-overlay" id="iceModal" onclick="closeIceModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="iceModalTitle">破冰明细</div>
      <button class="modal-close" onclick="closeIceModal()">&times;</button>
    </div>
    <div id="iceModalBody"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-product="cz" onclick="navTo('cz')"><span class="nav-icon">💰</span><span class="nav-label">鲤想财资</span></button>
  <button class="nav-item" data-product="zc" onclick="navTo('zc')"><span class="nav-icon">🏊</span><span class="nav-label">锦鲤资产池</span></button>
  <button class="nav-item" data-product="xgj" onclick="navTo('xgj')"><span class="nav-icon">💼</span><span class="nav-label">鲤想薪管家</span></button>
  <button class="nav-item" data-product="zy" onclick="navTo('zy')"><span class="nav-icon">🏢</span><span class="nav-label">鲤想智园</span></button>
  <button class="nav-item" data-product="zgj" onclick="navTo('zgj')"><span class="nav-icon">🏠</span><span class="nav-label">鲤想住管家</span></button>
</div>

<script>
// ============ STATE ============
let DATA = null;
let CM_DATA = null;
let currentProduct = 'cz';
let currentQuarter = 'q4';
let currentRole = 'branch_all';
let currentBranch = '';
let currentTeam = '';
// Drill level: 'home' | 'branch' | 'team'
let drillLevel = 'home';

const PRODUCTS = {
  cz:  { name: '鲤想财资', icon: '💰' },
  zc:  { name: '锦鲤资产池', icon: '🏊' },
  xgj: { name: '鲤想薪管家', icon: '💼' },
  zy:  { name: '鲤想智园', icon: '🏢' },
  zgj: { name: '鲤想住管家', icon: '🏠' }
};

// CM field mapping: which fields in cm.json represent need/done per product
const CM_FIELDS = {
  cz:  { need: 'cn', done: 'cd' },
  zc:  { need: 'zn', done: 'zd' },
  xgj: { need: 'xn', done: 'xd' }
};

// ============ DATA ACCESSORS ============
// Extract product data from a branch object
function branchProduct(branchObj, pk) {
  if (!branchObj) return null;
  if (pk === 'cz') {
    const d = branchObj.cz || {};
    const net = (currentQuarter === 'q3') ? ((d.q3||0) - (d.start||0)) : (d.net||0);
    const target = (currentQuarter === 'q3') ? 0 : (d.net_q4_target||0);
    return {
      value: d.value||0, net, target,
      ice_need: d.ice?.need||0, ice_done: d.ice?.done||0, ice_rate: d.ice?.rate||0
    };
  }
  const d = branchObj[pk];
  if (typeof d === 'object' && d !== null) {
    return {
      value: d.value||0,
      net: d.net||0, target: d.net_q4_target||0,
      ice_need: d.ice?.need||0, ice_done: d.ice?.done||0, ice_rate: d.ice?.rate||0
    };
  }
  // zy/zgj: {value: number, ice: "是"/"否"}
  return { value: d?.value||0, net:0, target:0, ice_need:0, ice_done:0, ice_rate: 0, ice_str: d?.ice };
}

// Extract product data from a team object
function teamProduct(teamObj, pk) {
  if (!teamObj) return null;
  if (pk === 'cz') {
    const ice = teamObj.cz_ice || {};
    return { value: teamObj.cz_value||0, ice_need: ice.need||0, ice_done: ice.done||0, ice_rate: ice.rate||0 };
  }
  if (pk === 'zc') {
    const ice = teamObj.zc_ice || {};
    return { value: 0, ice_need: ice.need||0, ice_done: ice.done||0, ice_rate: ice.rate||0 };
  }
  if (pk === 'xgj') {
    const ice = teamObj.xgj_ice || {};
    return { value: teamObj.xgj_value||0, ice_need: ice.need||0, ice_done: ice.done||0, ice_rate: ice.rate||0 };
  }
  // zy/zgj: only branch-level data, team has zy_value
  if (pk === 'zy') return { value: teamObj.zy_value||0, ice_need:0, ice_done:0, ice_rate:0 };
  return { value: 0, ice_need:0, ice_done:0, ice_rate:0 };
}

// ============ HELPERS ============
function parseRate(r) {
  if (typeof r === 'number') return r;
  if (!r || r === '-') return 0;
  return parseFloat(String(r).replace('%','')) || 0;
}
function rateClass(rate) {
  if (rate >= 80) return 'text-green';
  if (rate >= 50) return 'text-blue';
  if (rate > 0) return 'text-orange';
  return 'text-gray';
}
function rateColor(rate) {
  if (rate >= 80) return 'var(--green)';
  if (rate >= 50) return 'var(--blue)';
  return 'var(--orange)';
}
function formatNetRate(net, target) {
  if (!target || target === 0) return { text: '-', cls: 'text-gray', value: 0 };
  const rate = net / target * 100;
  if (rate < 0) return { text: '未达标', cls: 'text-gray', value: rate };
  return { text: rate.toFixed(1) + '%', cls: rateClass(rate), value: rate };
}
function progressBar(rate) {
  const w = Math.max(0, Math.min(100, rate));
  return `<div class="progress-bar"><div class="progress-fill" style="width:${w}%;background:${rateColor(rate)}"></div></div>`;
}

// ============ DATA LOADING ============
async function loadData() {
  try {
    const resp = await fetch(`data.json?t=${Date.now()}`);
    DATA = await resp.json();
    document.getElementById('headerDate').textContent = `数据日期：${DATA.date || ''}`;
    populateBranchSelect();
    renderHome();
  } catch (e) {
    document.getElementById('homeGrid').innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
    console.error(e);
  }
}

async function loadCM() {
  if (CM_DATA) return CM_DATA;
  try {
    const resp = await fetch(`cm.json?t=${Date.now()}`);
    CM_DATA = await resp.json();
    return CM_DATA;
  } catch (e) {
    console.error('cm.json load failed', e);
    return [];
  }
}

// ============ ROLE & SELECTORS ============
function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role));
  const bs = document.getElementById('branchSelect');
  const ts = document.getElementById('teamSelect');
  bs.classList.toggle('hidden', role === 'branch_all');
  ts.classList.toggle('hidden', role !== 'team');
  if (role === 'branch_all') {
    currentBranch = ''; currentTeam = '';
    bs.value = '';
  }
  if (role !== 'team') {
    currentTeam = '';
    ts.value = '';
  }
  // If in detail view, re-render at the correct drill level
  if (drillLevel !== 'home') {
    syncDrillLevelFromRole();
    renderDetail();
  } else {
    renderHome();
  }
}

function syncDrillLevelFromRole() {
  if (currentRole === 'branch_all') {
    drillLevel = 'branch'; // show all branches in detail
    currentBranch = ''; currentTeam = '';
  } else if (currentRole === 'sub_branch' && currentBranch) {
    drillLevel = 'branch'; // show teams of selected branch
  } else if (currentRole === 'team' && currentBranch && currentTeam) {
    drillLevel = 'team';
  }
}

function populateBranchSelect() {
  if (!DATA || !DATA.all_branches) return;
  const sel = document.getElementById('branchSelect');
  sel.innerHTML = '<option value="">选择支行</option>' +
    DATA.all_branches.map(b => `<option value="${b}">${b}</option>`).join('');
}

function onBranchChange() {
  currentBranch = document.getElementById('branchSelect').value;
  currentTeam = '';
  document.getElementById('teamSelect').value = '';
  if (currentRole === 'team') populateTeamSelect();
  if (drillLevel !== 'home') {
    drillLevel = currentBranch ? 'branch' : 'branch';
    renderDetail();
  } else {
    renderHome();
  }
}

function populateTeamSelect() {
  const sel = document.getElementById('teamSelect');
  if (!currentBranch || !DATA || !DATA.teams) {
    sel.innerHTML = '<option value="">选择团队</option>';
    return;
  }
  const teams = [...new Set(DATA.teams.filter(t => t.branch === currentBranch).map(t => t.team))];
  sel.innerHTML = '<option value="">选择团队</option>' +
    teams.map(t => `<option value="${t}">${t}</option>`).join('');
}

function onTeamChange() {
  currentTeam = document.getElementById('teamSelect').value;
  if (drillLevel !== 'home') {
    drillLevel = (currentTeam && currentBranch) ? 'team' : 'branch';
    renderDetail();
  } else {
    renderHome();
  }
}

function switchQuarter(q) {
  currentQuarter = q;
  document.querySelectorAll('.quarter-toggle button').forEach(b => b.classList.toggle('active', b.dataset.q === q));
  if (drillLevel === 'home') renderHome();
  else renderDetail();
}

// ============ HOME
