<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>融智产品通报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6fa;color:#1a1a2e;font-size:14px;line-height:1.5;max-width:500px;margin:0 auto;padding-bottom:70px}
.header{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700}.header .date{font-size:13px;opacity:.8;margin-top:4px}
.role-bar{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
.role-btn{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid #3b82f6;background:#fff;color:#3b82f6;cursor:pointer;white-space:nowrap}
.role-btn.active{background:#3b82f6;color:#fff}
.filter-bar{display:flex;gap:8px;padding:8px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
.filter-bar select{flex:1;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;background:#fff}
.tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #e5e7eb}
.tab{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;color:#8e8e93;background:#f5f6fa;cursor:pointer;white-space:nowrap;border:1.5px solid transparent}
.tab.active{color:#3b82f6;border-color:#3b82f6;background:rgba(59,130,246,.08)}
.glossary{margin:12px 16px;background:#fff;border-radius:12px;padding:12px 16px;font-size:12px;color:#6b7280;line-height:1.8}
.glossary summary{font-size:13px;font-weight:600;color:#1a1a2e;cursor:pointer}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi .label{font-size:11px;color:#8e8e93;font-weight:600;text-transform:uppercase}
.kpi .value{font-size:28px;font-weight:800;margin:4px 0}.kpi .meta{font-size:11px;color:#8e8e93}
.kpi .bar{height:4px;background:#f0f0f0;border-radius:2px;margin-top:8px}.kpi .bar-fill{height:100%;border-radius:2px}
.section{padding:12px 16px}
.section h3{font-size:15px;font-weight:700;margin-bottom:12px}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{text-align:left;padding:8px 6px;border-bottom:2px solid #e8e8e8;color:#8e8e93;font-weight:600;font-size:11px;white-space:nowrap}
.mtable td{padding:10px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.mtable tr:active{background:#f0f5ff}
.mtable tr.rank-top{background:rgba(16,185,129,.08)}.mtable tr.rank-top td:first-child{border-left:3px solid #10b981}
.mtable tr.rank-bottom{background:rgba(239,68,68,.06)}.mtable tr.rank-bottom td:first-child{border-left:3px solid #ef4444}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700}
.b-g{background:#d1fae5;color:#065f46}.b-y{background:#fef3c7;color:#92400e}.b-r{background:#fee2e2;color:#991b1b}.b-gray{background:#e5e7eb;color:#6b7280}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;margin-right:8px;display:inline-flex;align-items:center;justify-content:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;padding:8px 0;z-index:100;max-width:500px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8e8e93;cursor:pointer;padding:4px 12px;border-radius:8px}
.nav-item.active{color:#3b82f6;background:rgba(59,130,246,.08)}.nav-item .nav-icon{font-size:18px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 16px 30px}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal .close-btn{font-size:24px;cursor:pointer;color:#8e8e93;padding:4px 8px}
.cm-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.cm-item:last-child{border:none}.cm-name{font-weight:600;font-size:14px}.cm-info{font-size:12px;color:#8e8e93}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
</style>
</head>
<body>

<div class="header">
<div style="display:flex;align-items:center">
<button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">←</button>
<h1 id="headerTitle">📊 融智产品通报</h1>
</div>
<div class="date" id="headerDate">上海分行</div>
</div>

<div class="role-bar" id="roleBar">
<button class="role-btn active" onclick="setRole('fh')" data-role="fh">🏦 分行</button>
<button class="role-btn" onclick="setRole('zh')" data-role="zh">🏢 支行</button>
<button class="role-btn" onclick="setRole('td')" data-role="td">👥 团队</button>
</div>

<div class="filter-bar" id="filterBar" style="display:none">
<select id="branchSelect" onchange="onBranchChange()"><option value="">选择支行</option></select>
<select id="teamSelect" onchange="onTeamChange()" style="display:none"><option value="">选择团队</option></select>
</div>

<details class="glossary">
<summary>📖 术语说明</summary>
<div style="margin-top:8px">
<strong>有价值客户：</strong>具有较高商业价值的客户<br>
<strong>破冰：</strong>客户经理首次成功拓展该产品客户<br>
<strong>净增：</strong>当前值 - 年初值<br>
<strong>完成率：</strong>净增 ÷ 净增目标 × 100%
</div>
</details>

<div class="tabs" id="tabs">
<div class="tab active" onclick="setTab('cz')" data-tab="cz">💰 财资</div>
<div class="tab" onclick="setTab('zc')" data-tab="zc">🏊 资产池</div>
<div class="tab" onclick="setTab('xgj')" data-tab="xgj">💼 薪管家</div>
<div class="tab" onclick="setTab('zy')" data-tab="zy">🏢 智园</div>
<div class="tab" onclick="setTab('zgj')" data-tab="zgj">🏠 住管家</div>
</div>

<div id="content"></div>

<div class="bottom-nav">
<div class="nav-item active" onclick="setTab('cz')" data-nav="cz"><div class="nav-icon">💰</div>财资</div>
<div class="nav-item" onclick="setTab('zc')" data-nav="zc"><div class="nav-icon">🏊</div>资产池</div>
<div class="nav-item" onclick="setTab('xgj')" data-nav="xgj"><div class="nav-icon">💼</div>薪管家</div>
<div class="nav-item" onclick="setTab('zy')" data-nav="zy"><div class="nav-icon">🏢</div>智园</div>
<div class="nav-item" onclick="setTab('zgj')" data-nav="zgj"><div class="nav-icon">🏠</div>住管家</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<h3><span id="modalTitle">破冰明细</span><span class="close-btn" onclick="closeModal()">&times;</span></h3>
<div id="modalBody"></div>
</div>
</div>

<script>
const PN={cz:'鲤想财资',zc:'锦鲤资产池',xgj:'鲤想薪管家',zy:'鲤想智园',zgj:'鲤想住管家'};
const PC={cz:'#007AFF',zc:'#5AC8FA',xgj:'#AF52DE',zy:'#FF9500',zgj:'#34C759'};
let D=null,CM=null,role='fh',tab='cz',branch='',team='',cmLoaded=false;

async function loadData(){
try{
const r=await fetch('data.json?t='+Date.now());
D=await r.json();
document.getElementById('headerDate').textContent='上海分行 · 数据日期 '+D.date;
init();
}catch(e){
document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px;color:#8e8e93">加载失败，请刷新</div>';
}
}

async function loadCM(){
if(cmLoaded)return true;
try{const r=await fetch('cm.json?t='+Date.now());CM=await r.json();cmLoaded=true;return true;}catch(e){return false;}
}

function init(){
const bs=document.getElementById('branchSelect');
D.all_branches.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b.replace('上海','');bs.appendChild(o);});
render();
}

function setRole(r){
role=r;
document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===r));
document.getElementById('filterBar').style.display=r==='fh'?'none':'flex';
document.getElementById('teamSelect').style.display=r==='td'?'inline-block':'none';
if(r==='fh'){branch='';team='';document.getElementById('branchSelect').value='';document.getElementById('teamSelect').innerHTML='<option value="">选择团队</option>';}
if(r==='zh'){team='';document.getElementById('teamSelect').innerHTML='<option value="">选择团队</option>';}
render();
}

function setTab(t){
tab=t;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===t));
render();
}

function onBranchChange(){
branch=document.getElementById('branchSelect').value;
team='';
fillTeams();
render();
}

function onTeamChange(){
team=document.getElementById('teamSelect').value;
render();
}

function fillTeams(){
const sel=document.getElementById('teamSelect');
sel.innerHTML='<option value="">选择团队</option>';
if(!branch||!D.teams)return;
const ts=[...new Set(D.teams.filter(t=>t.branch===branch).map(t=>t.team))].sort();
ts.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.replace(branch,'');sel.appendChild(o);});
}

function getB(){if(!D||!D.branches)return[];let l=D.branches;if(role!=='fh'&&branch)l=l.filter(b=>b.branch===branch);return l;}
function getT(){if(!D||!D.teams)return[];let l=D.teams;if(branch)l=l.filter(t=>t.branch===branch);if(team)l=l.filter(t=>t.team===team);return l;}
function pct(v,t){if(t<=0)return'-';return(t>0?(v/t*100).toFixed(1):'0');}
function barColor(r){return r>=80?'#10b981':r>=50?'#3b82f6':'#f59e0b';}
function badge(r){if(r==='-')return'<span class="badge b-gray">-</span>';const n=Number(r);const c=n>=80?'b-g':n>=50?'b-y':n>=0?'b-r':'b-gray';return'<span class="badge '+c+'">'+r+'%</span>';}
function netBadge(rate){if(rate==='-')return'<span class="badge b-gray">-</span>';const n=Number(rate);if(n<0)return'<span class="badge b-gray">未达标</span>';const c=n>=100?'b-g':n>=60?'b-b':'b-y';return'<span class="badge '+c+'">'+rate+'%</span>';}

function render(){
if(!D){document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px;color:#8e8e93">加载中...</div>';return;}
const fb=getB(),ft=getT();
const p=tab;
let h='';

// KPI
if(['cz','zc','xgj'].includes(p)){
const v=fb.reduce((s,b)=>s+(b[p]?b[p].value:0),0);
const start=fb.reduce((s,b)=>s+(b[p]?b[p].start||0:0),0);
const tgt=fb.reduce((s,b)=>s+(b[p]?b[p].q4||0:0),0);
const need=fb.reduce((s,b)=>s+(b[p]&&b[p].ice?b[p].ice.need||0:0),0);
const done=fb.reduce((s,b)=>s+(b[p]&&b[p].ice?b[p].ice.done||0:0),0);
const net=v-start;const netTgt=tgt-start;
const nr=netTgt>0?Math.round(net/netTgt*100):0;
const ir=need>0?Math.round(done/need*100):0;
const scope=team?team.replace(branch.replace('上海',''),''):branch?branch.replace('上海',''):'全行';
h+='<div class="kpi-grid">';
h+='<div class="kpi"><div class="label">有价值客户</div><div class="value" style="color:'+PC[p]+'">'+v+'</div><div class="meta">目标 '+tgt+'</div></div>';
h+='<div class="kpi"><div class="label">净增完成率</div><div class="value" style="color:'+PC[p]+'">'+nr+'%</div><div class="meta">净增 '+net+' / 目标 '+netTgt+'</div><div class="bar"><div class="bar-fill" style="width:'+Math.min(nr,100)+'%;background:'+barColor(nr)+'"></div></div></div>';
h+='<div class="kpi"><div class="label">破冰完成率</div><div class="value" style="color:'+PC[p]+'">'+ir+'%</div><div class="meta">'+done+' / '+need+' 已破冰</div><div class="bar"><div class="bar-fill" style="width:'+Math.min(ir,100)+'%;background:'+barColor(ir)+'"></div></div></div>';
h+='<div class="kpi"><div class="label">覆盖范围</div><div class="value" style="color:'+PC[p]+'">'+fb.length+'</div><div class="meta">'+scope+'</div></div>';
h+='</div>';
}else{
const v=fb.reduce((s,b)=>s+(b[p]?b[p].value:0),0);
h+='<div class="kpi-grid"><div class="kpi"><div class="label">'+PN[p]+' 有价值</div><div class="value" style="color:'+PC[p]+'">'+v+'</div></div></div>';
}

// Table
h+='<div class="section">';
if(role==='td'&&team){
// Team detail - show CMs
h+='<h3>👥 '+team.replace(branch.replace('上海',''),'')+' · 客户经理</h3>';
if(CM){
const cms=CM.filter(c=>c.b===branch&&c.t===team);
if(cms.length>0){
h+='<table class="mtable"><thead><tr><th>姓名</th><th>到岗月</th><th>资质</th><th>财资</th><th>资产池</th><th>薪管家</th></tr></thead><tbody>';
cms.forEach(c=>{
h+='<tr><td><strong>'+c.n+'</strong></td><td>'+c.m+'</td><td>'+c.q+'</td>';
h+='<td>'+(c.cn?(c.cd?'<span class="badge b-g">✓</span>':'<span class="badge b-r">✗</span>'):'<span style="color:#8e8e93">-</span>')+'</td>';
h+='<td>'+(c.zn?(c.zd?'<span class="badge b-g">✓</span>':'<span class="badge b-r">✗</span>'):'<span style="color:#8e8e93">-</span>')+'</td>';
h+='<td>'+(c.xn?(c.xd?'<span class="badge b-g">✓</span>':'<span class="badge b-r">✗</span>'):'<span style="color:#8e8e93">-</span>')+'</td>';
h+='</tr>';
});
h+='</tbody></table>';
}else{h+='<div style="text-align:center;padding:20px;color:#8e8e93">暂无客户经理数据</div>';}
}else{h+='<div style="text-align:center;padding:20px;color:#8e8e93">加载客户经理数据中...</div>';}
}else if(branch){
// Branch detail - show teams
h+='<h3>🏢 '+branch.replace('上海','')+' · 团队明细</h3>';
h+='<table class="mtable"><thead><tr><th>团队</th><th>有价值</th><th>破冰率</th></tr></thead><tbody>';
ft.forEach(t=>{
const tn=t.team.replace(branch,'');
const ir=t[p+'_ice']?t[p+'_ice'].rate||0:0;
const v=t[p+'_value']||0;
h+='<tr onclick="selectTeam(\''+t.team+'\')" style="cursor:pointer"><td><strong>'+tn+'</strong></td><td>'+v+'</td><td>'+badge(ir)+'</td></tr>';
});
h+='</tbody></table>';
}else{
// All branches
h+='<h3>🏦 支行明细</h3>';
h+='<table class="mtable"><thead><tr><th>支行</th><th>当前</th><th>净增/目标</th><th>完成率</th><th>破冰率</th></tr></thead><tbody>';
fb.forEach(b=>{
const d=b[p];if(!d)return;
const net=d.value-(d.start||0);const tgt=(d.q4||0)-(d.start||0);
const nr=pct(net,tgt);const ir=d.ice?d.ice.rate||0:0;
h+='<tr onclick="selectBranch(\''+b.branch+'\')" style="cursor:pointer"><td><strong>'+b.branch.replace('上海','').replace('支行','')+'</strong></td><td>'+d.value+'</td><td>'+net+'/'+tgt+'</td><td>'+netBadge(nr)+'</td><td><span class="badge clickable" onclick="event.stopPropagation();showIce(\''+p+'\',\''+b.branch+'\',\'\')">'+ir+'%</span></td></tr>';
});
h+='</tbody></table>';
}
h+='</div>';
document.getElementById('content').innerHTML=h;
}

function selectBranch(b){
branch=b;
document.getElementById('branchSelect').value=b;
fillTeams();
setRole('zh');
}

function selectTeam(t){
team=t;
document.getElementById('teamSelect').value=t;
setRole('td');
}

function goBack(){
if(team){team='';document.getElementById('teamSelect').value='';render();}
else if(branch){branch='';document.getElementById('branchSelect').value='';setRole('fh');}
}

async function showIce(product,targetBranch,targetTeam){
try{
const loaded=await loadCM();
if(!loaded||!CM){alert('数据加载中');return;}
let cms=CM.filter(c=>c.b===targetBranch);
if(targetTeam)cms=cms.filter(c=>c.t===targetTeam);
const needField=product==='cz'?'cn':product==='zc'?'zn':'xn';
const doneField=product==='cz'?'cd':product==='zc'?'zd':'xd';
const needCMs=cms.filter(c=>c&&c[needField]);
const doneCMs=needCMs.filter(c=>c[doneField]);
const undoneCMs=needCMs.filter(c=>!c[doneField]);
const title=targetTeam?targetTeam.replace(targetBranch,''):targetBranch.replace('上海','');
document.getElementById('modalTitle').textContent=PN[product]+' · '+title;
let body='';
if(undoneCMs.length>0){
body+='<div style="margin-bottom:16px"><h4 style="color:#ef4444;font-size:13px;margin-bottom:8px">❌ 未破冰 · '+undoneCMs.length+'人</h4>';
undoneCMs.forEach(c=>{body+='<div class="cm-item"><div><div class="cm-name">'+c.n+'</div><div class="cm-info">到岗 '+c.m+' 月'+(c.q?' · '+c.q:'')+'</div></div><div style="color:#ef4444;font-weight:600;font-size:12px">未破冰</div></div>';});
body+='</div>';
}
if(doneCMs.length>0){
body+='<div style="margin-bottom:16px"><h4 style="color:#10b981;font-size:13px;margin-bottom:8px">✅ 已破冰 · '+doneCMs.length+'人</h4>';
doneCMs.forEach(c=>{body+='<div class="cm-item"><div><div class="cm-name">'+c.n+'</div><div class="cm-info">到岗 '+c.m+' 月'+(c.q?' · '+c.q:'')+'</div></div><div style="color:#10b981;font-weight:600;font-size:12px">已破冰</div></div>';});
body+='</div>';
}
if(undoneCMs.length===0&&doneCMs.length===0){body='<div style="text-align:center;padding:20px;color:#8e8e93">暂无需要破冰的客户经理</div>';}
document.getElementById('modalBody').innerHTML=body;
document.getElementById('modalOverlay').classList.add('show');
}catch(e){alert('加载失败: '+e.message);}
}

function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('show');}

loadData();
</script>
</body>
</html>
