<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>融智产品进度通报 · 2026-11-15</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1a1a2e;--tx2:#8e8e93;--blue:#007AFF;--green:#34C759;
--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--teal:#5AC8FA;--line:#ececf1;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 24px}
.hd{background:linear-gradient(135deg,#1a1a2e 0%,#2d2d44 100%);color:#fff;padding:20px 16px 18px;
border-radius:0 0 20px 20px;margin:0 -12px 14px}
.hd h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:12.5px;color:#b9b9c8;margin-top:5px}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.kpi .c{background:rgba(255,255,255,.09);border-radius:10px;padding:8px 4px;text-align:center}
.kpi .c .nm{font-size:11px;color:#c9c9d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .c .vv{font-size:15px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.g{color:#34C759}.o{color:#FF9500}.r{color:#FF6B5E}.w{color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:9px;background:#fff;color:var(--tx2);
font-size:13px;border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--tx);color:#fff;border-color:var(--tx);font-weight:600}
.tool{display:flex;gap:8px;margin-bottom:12px}
.tool input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
background:#fff;font-size:14px;outline:none;color:var(--tx)}
.tool input:focus{border-color:#c7c7d1}
.card{background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;
box-shadow:0 1px 3px rgba(20,20,40,.05)}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .nm{font-size:15.5px;font-weight:600}
.card .rk{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.badge{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.b1{background:#e8f8ec;color:#1a9c3e}.b2{background:#fff4e0;color:#c47a00}
.b3{background:#ffe9e7;color:#d02a1c}.b0{background:#f0f0f4;color:#8e8e93}
.row{margin-top:9px}
.row .h{display:flex;justify-content:space-between;font-size:12.5px;color:#5a5a6e;margin-bottom:4px}
.row .h b{font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.bar{height:6px;background:#f0f0f4;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.meta{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{margin-top:16px;font-size:11.5px;color:#9a9aa8;line-height:1.7;padding:0 2px}
.empty{text-align:center;color:var(--tx2);font-size:13px;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>融智产品 Q4 进度通报</h1>
    <div class="sub">数据日期 2026-11-15 ｜ 34 家经营单位（不含零售子单位）</div>
    <div class="kpi" id="kpi"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tool"><input id="q" placeholder="搜索支行 / 区域发展部"></div>
  <div id="list"></div>
  <div class="note">
    口径：净增 = 当前 − 年初；完成率 = 净增 ÷ 净增目标。<br>
    完成率 ≥100% 为达标，50%–99% 为进行中，&lt;50% 为滞后；“—”表示未下达净增目标。<br>
    五产品分别考核，超额部分不可跨产品抵扣。本页仅含支行层面汇总，不含客户经理个人信息。<br><a href="index.html" style="color:#007AFF">→ 返回考核看板</a>
  </div>
</div>
<script>
const D = {"date":"2026-11-15","units":[{"n":"奉贤区域部","p":{"财资":[3,3],"薪管家":[2,3],"资产池":[5,3],"智园":[1,1],"住管家":[0,1]},"tn":11,"tt":11,"team":3,"rk":5},{"n":"营业部","p":{"财资":[5,4],"薪管家":[8,5],"资产池":[16,6],"智园":[1,1],"住管家":[0,2]},"tn":30,"tt":18,"team":4,"rk":3},{"n":"金山区域部","p":{"财资":[1,0],"薪管家":[0,0],"资产池":[1,0],"智园":[0,0],"住管家":[0,0]},"tn":2,"tt":0,"team":3,"rk":0},{"n":"华新","p":{"财资":[0,5],"薪管家":[1,4],"资产池":[3,3],"智园":[0,1],"住管家":[0,1]},"tn":4,"tt":14,"team":3,"rk":22},{"n":"南汇","p":{"财资":[4,5],"薪管家":[11,9],"资产池":[20,4],"智园":[0,1],"住管家":[1,1]},"tn":36,"tt":20,"team":4,"rk":2},{"n":"南翔","p":{"财资":[-1,5],"薪管家":[1,11],"资产池":[0,4],"智园":[-1,1],"住管家":[0,2]},"tn":-1,"tt":23,"team":4,"rk":30},{"n":"周浦","p":{"财资":[0,4],"薪管家":[3,6],"资产池":[3,3],"智园":[0,1],"住管家":[0,1]},"tn":6,"tt":15,"team":3,"rk":20},{"n":"唐镇","p":{"财资":[5,5],"薪管家":[1,4],"资产池":[1,3],"智园":[0,1],"住管家":[0,2]},"tn":7,"tt":15,"team":3,"rk":19},{"n":"嘉定","p":{"财资":[2,7],"薪管家":[10,7],"资产池":[1,6],"智园":[1,1],"住管家":[0,2]},"tn":14,"tt":23,"team":4,"rk":15},{"n":"大场","p":{"财资":[3,3],"薪管家":[1,2],"资产池":[1,2],"智园":[1,1],"住管家":[0,1]},"tn":6,"tt":9,"team":3,"rk":13},{"n":"奉贤","p":{"财资":[11,9],"薪管家":[6,8],"资产池":[9,6],"智园":[2,1],"住管家":[0,2]},"tn":28,"tt":26,"team":4,"rk":4},{"n":"宝山","p":{"财资":[5,5],"薪管家":[12,13],"资产池":[0,6],"智园":[2,1],"住管家":[0,2]},"tn":19,"tt":27,"team":5,"rk":12},{"n":"川沙","p":{"财资":[5,6],"薪管家":[4,8],"资产池":[13,7],"智园":[0,1],"住管家":[0,1]},"tn":22,"tt":23,"team":4,"rk":6},{"n":"徐汇","p":{"财资":[3,5],"薪管家":[3,11],"资产池":[15,8],"智园":[0,1],"住管家":[0,1]},"tn":21,"tt":26,"team":4,"rk":8},{"n":"新桥","p":{"财资":[4,5],"薪管家":[1,6],"资产池":[0,5],"智园":[0,1],"住管家":[0,1]},"tn":5,"tt":18,"team":4,"rk":23},{"n":"普陀","p":{"财资":[5,7],"薪管家":[0,7],"资产池":[8,8],"智园":[1,1],"住管家":[0,1]},"tn":14,"tt":24,"team":4,"rk":16},{"n":"曹安","p":{"财资":[3,7],"薪管家":[13,9],"资产池":[3,4],"智园":[1,1],"住管家":[0,2]},"tn":20,"tt":23,"team":4,"rk":7},{"n":"杨浦","p":{"财资":[0,3],"薪管家":[0,9],"资产池":[3,6],"智园":[0,1],"住管家":[0,1]},"tn":3,"tt":20,"team":4,"rk":29},{"n":"松江城区","p":{"财资":[-1,3],"薪管家":[0,4],"资产池":[4,3],"智园":[0,1],"住管家":[0,1]},"tn":3,"tt":12,"team":3,"rk":26},{"n":"松江","p":{"财资":[8,9],"薪管家":[3,13],"资产池":[8,6],"智园":[3,2],"住管家":[0,1]},"tn":22,"tt":31,"team":5,"rk":10},{"n":"浦东","p":{"财资":[1,5],"薪管家":[3,9],"资产池":[-1,7],"智园":[1,1],"住管家":[0,1]},"tn":4,"tt":23,"team":5,"rk":28},{"n":"罗店","p":{"财资":[1,1],"薪管家":[1,1],"资产池":[1,2],"智园":[0,1],"住管家":[0,1]},"tn":3,"tt":6,"team":2,"rk":18},{"n":"航头","p":{"财资":[0,2],"薪管家":[1,4],"资产池":[2,3],"智园":[0,1],"住管家":[0,1]},"tn":3,"tt":11,"team":3,"rk":24},{"n":"莘庄","p":{"财资":[1,4],"薪管家":[-1,6],"资产池":[4,3],"智园":[0,1],"住管家":[0,1]},"tn":4,"tt":15,"team":3,"rk":25},{"n":"虹口","p":{"财资":[0,2],"薪管家":[2,4],"资产池":[0,3],"智园":[0,1],"住管家":[0,1]},"tn":2,"tt":11,"team":3,"rk":27},{"n":"金山","p":{"财资":[0,3],"薪管家":[4,5],"资产池":[3,3],"智园":[1,1],"住管家":[0,1]},"tn":8,"tt":13,"team":4,"rk":14},{"n":"长宁","p":{"财资":[0,2],"薪管家":[1,3],"资产池":[-3,2],"智园":[0,1],"住管家":[0,1]},"tn":-2,"tt":9,"team":3,"rk":32},{"n":"闵行","p":{"财资":[4,7],"薪管家":[7,15],"资产池":[4,9],"智园":[1,1],"住管家":[0,0]},"tn":16,"tt":32,"team":5,"rk":17},{"n":"闸北","p":{"财资":[1,5],"薪管家":[1,5],"资产池":[4,7],"智园":[0,1],"住管家":[0,1]},"tn":6,"tt":19,"team":4,"rk":21},{"n":"青浦","p":{"财资":[8,9],"薪管家":[4,15],"资产池":[10,7],"智园":[2,1],"住管家":[0,1]},"tn":24,"tt":33,"team":5,"rk":9},{"n":"静安","p":{"财资":[4,3],"薪管家":[6,7],"资产池":[21,4],"智园":[1,1],"住管家":[0,1]},"tn":32,"tt":16,"team":4,"rk":1},{"n":"高境","p":{"财资":[1,0],"薪管家":[1,0],"资产池":[0,0],"智园":[0,0],"住管家":[0,0]},"tn":2,"tt":0,"team":2,"rk":0},{"n":"高行","p":{"财资":[-1,5],"薪管家":[0,5],"资产池":[0,3],"智园":[0,1],"住管家":[0,1]},"tn":-1,"tt":15,"team":3,"rk":31},{"n":"黄浦","p":{"财资":[3,5],"薪管家":[2,6],"资产池":[3,4],"智园":[4,1],"住管家":[0,1]},"tn":12,"tt":17,"team":4,"rk":11}],"tot":{"财资":{"n":88,"t":153,"ok":8,"ing":9,"lag":15,"notg":2},"薪管家":{"n":112,"t":224,"ok":5,"ing":9,"lag":18,"notg":2},"资产池":{"n":162,"t":150,"ok":15,"ing":7,"lag":10,"notg":2},"智园":{"n":22,"t":33,"ok":15,"ing":0,"lag":17,"notg":2},"住管家":{"n":1,"t":38,"ok":1,"ing":0,"lag":30,"notg":3}},"nrank":32,"full":{"财资":"鲤想财资","薪管家":"鲤想薪管家","资产池":"锦鲤资产池","智园":"鲤想智园","住管家":"鲤想住管家"}};
const P = ["财资","薪管家","资产池","智园","住管家"];
const COLOR = {"财资":"#007AFF","薪管家":"#34C759","资产池":"#AF52DE","智园":"#5AC8FA","住管家":"#FF9500"};
let cur = "全部";

function pct(r){ if(r===null||!isFinite(r)) return "—";
  const s = r.toFixed(1); return (s.endsWith(".0")? s.slice(0,-2): s) + "%"; }
function cls(r){ if(r===null) return "b0"; if(r>=100) return "b1"; if(r>=50) return "b2"; return "b3"; }
function cvar(r){ if(r===null) return "w"; if(r>=100) return "g"; if(r>=50) return "o"; return "r"; }
function rate(n,t){ return t>0 ? n/t*100 : null; }

// KPI
(function(){
  const box = document.getElementById("kpi");
  P.forEach(p=>{
    const t = D.tot[p], r = rate(t.n, t.t);
    box.insertAdjacentHTML("beforeend",
      `<div class="c"><div class="nm">${p}</div>
       <div class="vv ${cvar(r)}">${pct(r)}</div></div>`);
  });
})();

// tabs
(function(){
  const tb = document.getElementById("tabs");
  ["全部",...P].forEach(p=>{
    const b = document.createElement("div");
    b.className = "tab" + (p===cur?" on":"");
    b.textContent = p==="全部" ? "全部产品" : p;
    b.onclick = ()=>{ cur=p; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    tb.appendChild(b);
  });
})();

function rowsHTML(u){
  const list = cur==="全部" ? P : [cur];
  return list.map(p=>{
    const [n,t] = u.p[p]; const r = rate(n,t);
    const w = r===null?0:Math.max(0,Math.min(100, r));
    const gap = (t>0 && n<t) ? `缺 ${t-n} 户` : (t>0 && n>=t ? `超 ${n-t} 户` : "未下达目标");
    const gtxt = (t>0 && n>=t && n===t) ? "压线" : gap;
    return `<div class="row">
      <div class="h"><span>${D.full[p]} <b>${n>0?"+":""}${n}/${t||0}</b></span>
      <span>${pct(r)}　<span style="color:#9a9aa8">${gtxt}</span></span></div>
      <div class="bar"><i style="width:${w}%;background:${COLOR[p]}"></i></div>
    </div>`;
  }).join("");
}

function render(){
  document.querySelectorAll(".tab").forEach((el,i)=>{
    const name = i===0?"全部":P[i-1];
    el.className = "tab" + (name===cur?" on":"");
  });
  const q = document.getElementById("q").value.trim();
  const list = document.getElementById("list");
  let arr = D.units.filter(u=> !q || u.n.indexOf(q)>=0);
  let skipN = 0;
  if(cur==="全部"){
    arr = arr.slice().sort((a,b)=>{
      const ra = a.tt>0? a.tn/a.tt : -9e9, rb = b.tt>0? b.tn/b.tt : -9e9;
      return rb-ra;
    });
    skipN = arr.filter(u=>u.tt<=0).length;
  } else {
    skipN = arr.filter(u=>u.p[cur][1]<=0).length;
    arr = arr.filter(u=>u.p[cur][1]>0).sort((a,b)=>{
      return b.p[cur][0]/b.p[cur][1] - a.p[cur][0]/a.p[cur][1];
    });
  }
  if(!arr.length){ list.innerHTML = '<div class="empty">没有匹配的单位</div>'; return; }
  const tail = skipN>0 ? `<div class="note" style="margin-top:6px">另有 ${skipN} 家单位未下达${cur==="全部"?"":cur}净增目标，不计入完成率排名。</div>` : "";
  list.innerHTML = arr.map(u=>{
    // 无目标：紧凑卡
    if(cur==="全部" ? u.tt<=0 : u.p[cur][1]<=0){
      const n = cur==="全部" ? u.tn : u.p[cur][0];
      return `<div class="card" style="padding:11px 14px">
        <div class="top"><div><div class="nm">${u.n}</div>
        <div class="rk">未下达${cur==="全部"?"":cur}净增目标</div></div>
        <span class="badge b0">净增 ${n>0?"+":""}${n} 户</span></div></div>`;
    }
    let badge, rk;
    if(cur==="全部"){
      const r = rate(u.tn,u.tt);
      badge = `<span class="badge ${cls(r)}">${pct(r)}</span>`;
      rk = u.rk ? `全行第 ${u.rk}／${D.nrank}` : "未下达目标";
    } else {
      const [n,t] = u.p[cur]; const r = rate(n,t);
      badge = `<span class="badge ${cls(r)}">${pct(r)}</span>`;
      const withT = D.units.filter(x=>x.p[cur][1]>0)
        .sort((a,b)=> b.p[cur][0]/b.p[cur][1] - a.p[cur][0]/a.p[cur][1]);
      const i = withT.findIndex(x=>x.n===u.n);
      rk = i>=0 ? `本产品第 ${i+1}／${withT.length}` : "未下达目标";
    }
    const tot = cur==="全部" ? `合计净增 ${u.tn>0?"+":""}${u.tn}／${u.tt} 户` :
      (()=>{const [n,t]=u.p[cur]; return `净增 ${n>0?"+":""}${n}／${t} 户`;})();
    return `<div class="card">
      <div class="top"><div><div class="nm">${u.n}</div>
      <div class="rk">${rk}　·　${u.team} 个团队</div></div>${badge}</div>
      ${rowsHTML(u)}
      <div class="meta"><span>${tot}</span><span>数据日期 ${D.date}</span></div>
    </div>`;
  }).join("") + tail;
}
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
